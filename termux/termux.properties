# Barra de teclas extras do Termux (copie para ~/.termux/termux.properties e rode termux-reload-settings).
# As linhas 3 e 4 são botões do tt: cada um manda Ctrl+B F1…F10 e `tt --botao` decide pelo estado.
#   CL   Claude Code na pasta atual: vai para a sessão existente, cria uma, ou volta se já está nela
#   CLC  continua a última conversa     CLR  escolhe uma conversa para retomar
#   DBN  Debian (proot) na pasta atual: mesma lógica do CL
#   TL   liga/desliga o túnel da tela remota (tela_destino em ~/.config/tt/config)
#   ZM   zoom do painel                 X    fecha o que está vazio; se há algo rodando, só desanexa
#   TT   central de terminais           NM   nomear a sessão
#   ANT  sessão anterior                DV   divide o painel pelo lado maior
#   JN   janela nova                    PC / EMP  levam à máquina (na central)
extra-keys = [ \
 ['ESC','/','-','HOME','UP','END','PGUP'], \
 ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'], \
 [{macro: 'CTRL b F1', display: 'CL'}, {macro: 'CTRL b F2', display: 'CLC'}, {macro: 'CTRL b F3', display: 'CLR'}, {macro: 'CTRL b F4', display: 'DBN'}, {macro: 'CTRL b F5', display: 'TL'}, {macro: 'CTRL b F9', display: 'ZM'}, {macro: 'CTRL b F6', display: 'X'}], \
 [{macro: 'CTRL b s', display: 'TT'}, {macro: 'CTRL b N', display: 'NM'}, {macro: 'CTRL b F7', display: 'ANT'}, {macro: 'CTRL b F8', display: 'DV'}, {macro: 'CTRL b F10', display: 'JN'}, {macro: 'p c ENTER', display: 'PC'}, {macro: 'e m p ENTER', display: 'EMP'}] \
]
