# tmux.conf do tt — instalado em ~/.local/share/tt/tmux.conf e carregado pelo ~/.tmux.conf
# (source-file). Não edite a cópia instalada: ela é trocada a cada `tt --sincronizar`; ajustes só de
# uma máquina vão no ~/.tmux.conf dela, depois do source-file. Fonte: repositório tt (Projetos/tt).

# --- Geral ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
# Saída sincronizada (modo 2026): cada redesenho chega ao terminal como um bloco só, e o cursor não
# corre pela tela enquanto o tmux desenha. Terminais que não conhecem o modo simplesmente o ignoram.
set -as terminal-features ",xterm*:sync,tmux*:sync,screen*:sync,alacritty*:sync,foot*:sync,wezterm*:sync"
set -g extended-keys on          # Shift+Enter etc. chegam aos programas (Claude Code)
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on                  # rolar com a roda; Shift+arrastar seleciona como no terminal normal
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Tamanho dinâmico entre aparelhos: quem mexeu por último manda. Tecla, clique ou toque (também na
# barra), foco na janela, anexar ou mudar o tamanho da tela (girar o celular, abrir o teclado)
# passam a janela para aquele aparelho na hora; o outro, ao ser usado, toma de volta. Enquanto um
# aparelho só observa uma janela de outro tamanho, a barra dele mostra "⤢ caber aqui" (um toque
# encaixa). Ao carregar, solta janelas presas num tamanho fixo (window-size manual).
set -g window-size latest
setw -g aggressive-resize on
run-shell -b "~/.local/bin/tt --descongelar"
set-hook -g client-focus-in 'run-shell -b "~/.local/bin/tt --ajustar \"#{client_name}\""'
# Paleta comum de volta no terminal de quem anexa (algum programa pode ter mandado restaurar as cores).
# Usa o ajuste leve e local ao cliente; evita o redesenho global de 0,6-0,9 s em cada attach.
set-hook -g client-attached 'run-shell -b "~/.local/bin/tt --ajustar \"#{client_name}\""'

# Título da janela do GNOME Terminal / Windows Terminal
set -g set-titles on
set -g set-titles-string "#S · #{pane_current_command}"

# Nome da máquina na barra: o do tt (~/.config/tt/config, nome=…); até ele responder, o hostname.
set -g @maquina "#h"
run-shell -b 'tmux set -g @maquina "$(~/.local/bin/tt --nome)"'

# --- Atalhos (prefixo continua Ctrl+B) -----------------------------------
# Central: o tt escolhe o tamanho do popup (tela cheia em tela pequena, como no celular).
bind s run-shell -b "~/.local/bin/tt --clique tt '#{client_name}' '#{pane_id}' ''"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "config recarregada"

# Copiar e colar, igual em todo aparelho e em todo painel:
#  - arrastar seleciona e copia; duplo clique copia a palavra, triplo a linha. Vale também sobre
#    programas que capturam o mouse (Claude Code, Codex, pontes para outra máquina): sem isso o
#    arrasto ia para o programa e nada era copiado. Roda e clique simples continuam indo a ele;
#    Shift+arrastar ainda usa a seleção do próprio terminal;
#  - toda cópia avisa "📋 copiado (N caracteres)" e vai para a área de transferência do aparelho:
#    `tt --copiar` (Wayland/X/clip.exe, mesmo se o servidor nasceu sem ambiente gráfico) e OSC 52
#    ao terminal de fora (Termux via mosh, Windows Terminal); OSC 52 vindo de dentro dos painéis
#    (Claude, vim, tmux remoto) também chega lá;
#  - colar: Ctrl+Shift+V (ou o colar do terminal), botão do meio, ou "📋 Colar" no menu ⋯ do painel
#    (botão direito) — este último também no toque do celular.
set -s copy-command "~/.local/bin/tt --copiar"
set -s set-clipboard on
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"
set-hook -g pane-set-clipboard 'run-shell -b "~/.local/bin/tt --copiar-buffer"'
bind -n MouseDrag1Pane if -F "#{pane_in_mode}" { send -M } { copy-mode -M }
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{pane_in_mode}" { send -M } { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel ; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'" }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{pane_in_mode}" { send -M } { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel ; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'" }
bind -n MouseDown2Pane select-pane -t = \; if -F "#{pane_in_mode}" { send -M } { paste-buffer -p }
bind -n MouseUp2Pane if -F "#{pane_in_mode}" { send -M } {}
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"

# Visual comum: também reaplicado pelo vigia e ao conectar.
source-file ~/.local/share/tt/tema-tmux.conf
# Barras recalculadas por eventos; o padrão visual fica em tema-tmux.conf.
run-shell -b "~/.local/bin/tt --barras"
set-hook -g session-created 'run-shell -b "~/.local/bin/tt --barras"'
set-hook -g session-closed 'run-shell -b "~/.local/bin/tt --barras"'
set-hook -g session-renamed 'run-shell -b "~/.local/bin/tt --barras"'

# Ctrl+B N: renomear esta sessão (vem preenchido com um nome sugerido pelo assunto)
# (no celular a tela pode ter menos de 70 colunas: aí o popup ocupa a largura toda)
bind N if -F "#{e|<:#{client_width},72}" \
  "display-popup -E -w 100% -h 7 -T ' renomear ' \"~/.local/bin/tt --renomear\"" \
  "display-popup -E -w 70 -h 7 -T ' renomear ' \"~/.local/bin/tt --renomear\""

# --- Painéis (splits) ------------------------------------------------------
# Cada painel ganha uma barrinha no topo com número e nome: o que você deu (menu ⋯ → Renomear),
# a sessão que ele mostra (⧉, abertos pelo tt) ou o programa. Só aparece com mais de um painel.
# A barrinha só existe com 2+ painéis: com um só, ela ocupava uma linha (azul) no topo, e cada tmux
# dentro de tmux (pontes, painéis que mostram outra sessão) empilhava mais uma.
set -g pane-border-status off
set-hook -g window-layout-changed 'run-shell -b "~/.local/bin/tt --bordas"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/tt --bordas"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/tt --bordas"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/tt --bordas"'
# Rede de segurança contra ciclo de painéis (sessão que se mostra dentro dela mesma, até 1x1).
set-hook -g client-resized 'run-shell -b "~/.local/bin/tt --guarda-tamanho"'
set-hook -g window-resized 'run-shell -b "~/.local/bin/tt --guarda-tamanho"'
run-shell -b "~/.local/bin/tt --bordas"

# Cliques nos botões da barra (veja status-right) e menu do painel (Ctrl+B m, ou botão direito na
# barrinha do painel).
# Os menus agem ao SOLTAR (MouseUp): no celular o "soltar" do toque chega atrasado e fechava o
# menu que o "pressionar" tinha acabado de abrir. As fixadas (fxN e fxxN), porém, agem ao
# PRESSIONAR: a barra pode se redesenhar entre pressionar e soltar e perder o range sob o dedo.
# A lista de janelas continua no pressionar.
unbind -n MouseDown1StatusRight
unbind -n MouseDown1StatusLeft
bind -n MouseDown1StatusRight run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind -n MouseDown1StatusLeft run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind -n MouseUp1StatusRight run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind -n MouseUp1StatusLeft run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind -n MouseDown1Status run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind -n MouseUp1Status run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}'"
bind m run-shell -b "~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'"
# Histórico de cópias (de todas as máquinas): ⏎ cola aqui, ^y só copia, ^x apaga.
bind y run-shell -b "~/.local/bin/tt --clique copias '#{client_name}' '#{pane_id}' ''"
# Botão direito: no painel (quando o programa dele não usa o mouse), o menu do painel; em "máquina ▾",
# a administração; em "sessão ▾", o menu da sessão. Também abrem ao soltar o botão.
bind -n MouseDown3Pane if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" "select-pane -t = ; send-keys -M" "select-pane -t ="
bind -n MouseUp3Pane if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "run-shell -b -t = \"~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'\""
unbind -n MouseDown3StatusLeft
bind -n MouseUp3StatusLeft run-shell -b "~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'"
# Em "máquina ▾"/"sessão ▾" o tmux reporta o clique como Status (não StatusLeft): o pressionar não
# abre o menu de janelas padrão (que engoliria o soltar) e o soltar abre o menu das máquinas.
bind -n MouseDown3Status if -F "#{||:#{||:#{||:#{==:#{mouse_status_range},maquina},#{==:#{mouse_status_range},sessao}},#{m:fx*,#{mouse_status_range}}},#{m:at*,#{mouse_status_range}}}" {} { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }
bind -n MouseUp3Status if -F "#{||:#{||:#{||:#{==:#{mouse_status_range},maquina},#{==:#{mouse_status_range},sessao}},#{m:fx*,#{mouse_status_range}}},#{m:at*,#{mouse_status_range}}}" "run-shell -b \"~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'\"" ""
# Botão direito nos botões da direita da barra (📧 e-mail: menu com abrir, contas e atalhos).
unbind -n MouseDown3StatusRight
bind -n MouseUp3StatusRight run-shell -b "~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'"
bind -n MouseDown3Border run-shell -b -t = "~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'"

# Vigia que renomeia as sessões conforme o uso (uma instância só; termina junto com o tmux)
run-shell -b "~/.local/bin/tt --vigia"

# Botões inteligentes: a barra de teclas extras do Termux manda Ctrl+B F1…F10 e `tt --botao` decide
# pelo estado (ver termux/termux.properties). Também servem como atalhos de teclado.
bind F1  run-shell -b "~/.local/bin/tt --botao cl   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F2  run-shell -b "~/.local/bin/tt --botao clc  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F3  run-shell -b "~/.local/bin/tt --botao clr  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F4  run-shell -b "~/.local/bin/tt --botao dbn  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F5  run-shell -b "~/.local/bin/tt --botao tela '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F6  run-shell -b "~/.local/bin/tt --botao sair '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F7  run-shell -b "~/.local/bin/tt --botao ant  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F8  run-shell -b "~/.local/bin/tt --botao dv   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F9  run-shell -b "~/.local/bin/tt --botao zm   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F10 run-shell -b "~/.local/bin/tt --botao jn   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"

# Perfil local: ajustes só desta máquina/usuário, fora do pacote (que é trocado a cada instalação).
source-file -q ~/.config/tt/tmux.conf
