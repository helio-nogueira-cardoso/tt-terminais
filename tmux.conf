# tmux.conf do tt — instalado em ~/.local/share/tt/tmux.conf e carregado pelo ~/.tmux.conf
# (source-file). Não edite a cópia instalada: ela é trocada a cada `tt --sincronizar`; ajustes só de
# uma máquina vão no ~/.tmux.conf dela, depois do source-file. Fonte: repositório tt (Projetos/tt).

# --- Geral ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
# terminal-features é GRAVADO de uma vez (set, não set -a): com -a, cada source-file — e o tt recarrega a
# configuração a cada versão instalada — repetia as entradas (uma máquina chegou a 355). Os três primeiros
# itens são o padrão do próprio tmux. O que cada um liga:
#  - RGB, extkeys: cores reais e teclas estendidas (Shift+Enter etc. chegam ao Claude Code);
#  - sync: saída sincronizada (modo 2026) — cada redesenho chega ao terminal como um bloco só e o cursor
#    não corre pela tela enquanto o tmux desenha (Windows Terminal ≥ 1.24, iTerm2, kitty, foot, WezTerm,
#    Alacritty…); terminais que não conhecem o modo simplesmente o ignoram;
#  - hyperlinks: links OSC 8 dos programas chegam ao terminal de fora com a URL inteira em cada pedaço,
#    mesmo dentro de popup — o Ctrl+clique do próprio terminal (Windows Terminal, GNOME Terminal) abre
#    o link inteiro, não só a linha que ele vê;
#  - xterm-ghostty (Ghostty, o terminal padrão do tt): cores reais, teclas estendidas, sublinhado colorido e
#    ondulado (corretor do vim, diagnósticos), sobrelinha e tachado; o sync e os links vêm do xterm*.
set -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB:extkeys,xterm-ghostty:RGB:extkeys:usstyle:overline:strikethrough,xterm*:sync:hyperlinks,tmux*:sync,screen*:sync,alacritty*:sync,foot*:sync,wezterm*:sync"
# ☝ ⛹ ✌ ✍ 🏋 🏌 🕴 🕵 🖐 sem seletor ocupam 1 coluna na tabela Unicode e no Ghostty, mas o tmux dava 2: o terminal
# desenhava a linha 1 coluna mais curta e o resto dela (até um popup por cima) andava para a esquerda até o próximo
# redesenho. Com o seletor de emoji (☝️) seguem 2 colunas. O -q cala o tmux < 3.5, que não tem a opção.
set -sq codepoint-widths "U+261D=1,U+26F9=1,U+270C=1,U+270D=1,U+1F3CB=1,U+1F3CC=1,U+1F574=1,U+1F575=1,U+1F590=1"
set -g extended-keys on          # Shift+Enter etc. chegam aos programas (Claude Code)
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on                  # rolar com a roda; Shift+arrastar seleciona como no terminal normal
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Tamanho dinâmico entre aparelhos: quem mexeu por último manda. Tecla, clique ou toque (também na
# barra), foco na janela, anexar ou mudar o tamanho da tela (girar o celular, abrir o teclado)
# passam a janela para aquele aparelho na hora; o outro, ao ser usado, toma de volta. Enquanto um
# aparelho só observa uma janela de outro tamanho, a barra dele mostra "⤢ caber aqui" (um toque
# encaixa). Ao carregar, solta janelas presas num tamanho fixo (window-size manual).
set -g window-size latest
setw -g aggressive-resize on
run-shell -b "~/.local/bin/tt --descongelar"
set-hook -g client-focus-in 'run-shell -b "~/.local/bin/tt --ajustar \"#{client_name}\""'
# Paleta comum de volta no terminal de quem anexa (algum programa pode ter mandado restaurar as cores).
# Usa o ajuste leve e local ao cliente; evita o redesenho global de 0,6-0,9 s em cada attach.
set-hook -g client-attached 'run-shell -b "~/.local/bin/tt --ajustar \"#{client_name}\"; ~/.local/bin/tt --vigia-garantir"'
set-hook -g 'client-attached[22]' 'if-shell -F "#{!=:#{TT_PRECARREGAR},0}" { run-shell -b "~/.local/bin/tt --precarregar-evento evento" }'
set-hook -g 'client-session-changed[22]' 'if-shell -F "#{!=:#{TT_PRECARREGAR},0}" { run-shell -b "~/.local/bin/tt --precarregar-evento evento" }'
set-hook -g 'client-detached[22]' 'if-shell -F "#{!=:#{TT_PRECARREGAR},0}" { run-shell -b "~/.local/bin/tt --precarregar-evento evento" }'

# Título da janela do GNOME Terminal / Windows Terminal
set -g set-titles on
set -g set-titles-string "#S · #{pane_current_command}"

# Nome da máquina na barra: o do tt (~/.config/tt/config, nome=…); até ele responder, o hostname.
set -g @maquina "#h"
run-shell -b 'tmux set -g @maquina "$(~/.local/bin/tt --nome)"'

# --- Atalhos (prefixo continua Ctrl+B) -----------------------------------
# Central: o tt escolhe o tamanho do popup (tela cheia em tela pequena, como no celular).
bind s run-shell -b "~/.local/bin/tt --clique tt '#{client_name}' '#{pane_id}' ''"
# Escape da máquina da tela: também funciona quando o SSH da ponte não responde.
bind Escape run-shell -b "~/.local/bin/tt --recuperar-tela '#{client_name}'"
# Tarefas: mesma ação do botão 📋 da barra (abre o slide-over lateral direito).
bind t run-shell -b "~/.local/bin/tt --clique tarefas '#{client_name}' '#{pane_id}' ''"
# Voz: o mesmo que o botão 🎤 da barra (a janela da conversa por voz; no celular, a do Tasker).
bind v run-shell -b "~/.local/bin/tt --clique voz '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
# Snapshots do estado (histórico e restaurar): o mesmo que administrar → 📸.
bind S run-shell -b "~/.local/bin/tt --clique snapshots '#{client_name}' '#{pane_id}' ''"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "config recarregada"

# Copiar e colar, igual em todo aparelho e em todo painel:
#  - Ctrl + arrastar seleciona e copia; Ctrl + duplo clique copia a palavra (num link,
#    o link inteiro), Ctrl + triplo a linha. Alt e mouse sem Ctrl não copiam.
#    Vale sobre programas que capturam o mouse e pontes para outra máquina.
#    Shift+arrastar é seleção do terminal externo: o Shift não chega ao tmux.
#  - toda cópia avisa "📋 copiado (N caracteres)" e vai para a área de transferência do aparelho:
#    `tt --copiar` (Wayland/X/clip.exe, mesmo se o servidor nasceu sem ambiente gráfico) e OSC 52
#    ao terminal de fora (Termux via mosh, Windows Terminal); OSC 52 vindo de dentro dos painéis
#    (Claude, vim, tmux remoto) também chega lá;
#  - No Mac, configure o terminal para transmitir Ctrl+mouse; Option não autoriza cópia.
#    Sem mouse, Ctrl+B [ , v marca e y (ou Enter) copia.
#  - colar: Ctrl+Shift+V (no Mac, Cmd+V; ou o colar do terminal), botão do meio, ou "📋 Colar" no menu ⋯ do painel
#    (botão direito) — este último também no toque do celular.
set -s copy-command "~/.local/bin/tt --copiar"
set -s set-clipboard on
#    O tmux manda a cópia ao terminal como OSC 52 com a seleção vazia ("52;;…"), e o mosh (1.4) só
#    repassa "52;c;…": no Termux via mosh a cópia sumia no caminho e o Android ficava com a anterior.
#    Com a seleção "c" fixa chega; Windows Terminal, Termux, xterm e um tmux de fora entendem "c". Índice
#    fixo para recarregar a config não acumular; o tmux só aceita o Ms se o 1º parâmetro for consumido
#    (%p1%.0s).
set -s terminal-overrides[20] 'xterm*:Ms=\E]52;c%p1%.0s;%p2%s\7'
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"
set-hook -g pane-set-clipboard 'run-shell -b "~/.local/bin/tt --copiar-buffer"'
#  - o que a tela partiu em linhas (endereço, caminho, código longo quebrado na borda direita, com
#    recuo ou borda na linha de baixo, como no Claude Code) volta a ser uma coisa só na cópia: toda
#    cópia por seleção passa a largura do painel e a seleção ao `tt --copiar --tela`. Quebras de
#    verdade ficam como estão.
set -g @tt_copiar '~/.local/bin/tt --copiar --tela #{pane_width} #{selection_start_x} #{selection_start_y} #{selection_end_x} #{selection_end_y} #{rectangle_toggle} #{q:client_name}'
bind -n MouseDrag1Pane set -g @tt_link_id "" \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } {}
bind -n M-MouseDrag1Pane set -g @tt_link_id "" \; if -F "#{mouse_any_flag}" { send -M } {}
bind -n C-MouseDrag1Pane set -g @tt_link_id "" \; if -F "#{pane_in_mode}" { send -M } { copy-mode -M }
unbind -q -n C-MouseDrag1Empty
# No e-mail, duplo clique abre a mensagem. Só Ctrl autoriza cópia por mouse.
bind -n DoubleClick1Pane if -F '#{==:#{session_name},_tt-email}' { send Enter } { select-pane -t = ; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } {} }
bind -n M-DoubleClick1Pane if -F '#{==:#{session_name},_tt-email}' { send Enter } { if -F "#{mouse_any_flag}" { send -M } {} }
bind -n C-DoubleClick1Pane if -F '#{==:#{session_name},_tt-email}' { send Enter } { select-pane -t = ; if -F "#{pane_in_mode}" { send -M } { if-shell "python3 -I ~/.local/share/tt/links-tt.py copiar #{q:client_name} #{pane_id} #{mouse_x} #{mouse_y} #{pane_width} #{pane_height} #{q:mouse_hyperlink}" {} { copy-mode -H ; send -X select-word ; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" ; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'" } } }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } {}
bind -n M-TripleClick1Pane if -F "#{mouse_any_flag}" { send -M } {}
bind -n C-TripleClick1Pane select-pane -t = \; if -F "#{pane_in_mode}" { send -M } { copy-mode -H ; send -X select-line ; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" ; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'" }
bind -n MouseDown2Pane select-pane -t = \; if -F "#{pane_in_mode}" { send -M } { paste-buffer -p }
bind -n MouseUp2Pane if -F "#{pane_in_mode}" { send -M } {}
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode M-MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode M-MouseDown1Pane select-pane
bind -T copy-mode M-MouseDrag1Pane send -X stop-selection
bind -T copy-mode C-MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode C-MouseDown1Pane select-pane
bind -T copy-mode C-MouseDrag1Pane select-pane \; send -X stop-selection \; send -X clear-selection \; send -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi M-MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi M-MouseDown1Pane select-pane
bind -T copy-mode-vi M-MouseDrag1Pane send -X stop-selection
bind -T copy-mode-vi C-MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode-vi C-MouseDown1Pane select-pane
bind -T copy-mode-vi C-MouseDrag1Pane select-pane \; send -X stop-selection \; send -X clear-selection \; send -X begin-selection
bind -T copy-mode DoubleClick1Pane send -X stop-selection
bind -T copy-mode M-DoubleClick1Pane send -X stop-selection
bind -T copy-mode C-DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode TripleClick1Pane send -X stop-selection
bind -T copy-mode M-TripleClick1Pane send -X stop-selection
bind -T copy-mode C-TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode-vi DoubleClick1Pane send -X stop-selection
bind -T copy-mode-vi M-DoubleClick1Pane send -X stop-selection
bind -T copy-mode-vi C-DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"
bind -T copy-mode M-w send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode C-w send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode Enter send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode v send -X begin-selection
bind -T copy-mode y send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi C-j send -X copy-pipe-and-cancel "#{E:@tt_copiar}"
bind -T copy-mode-vi TripleClick1Pane send -X stop-selection
bind -T copy-mode-vi M-TripleClick1Pane send -X stop-selection
bind -T copy-mode-vi C-TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "#{E:@tt_copiar}" \; run-shell -b "~/.local/bin/tt --copiado '#{client_name}'"

# Não iniciar seleção sem Ctrl, nem herdar seleção de palavra/linha ao arrastar.
bind -T copy-mode MouseDrag1Pane send -X stop-selection
bind -T copy-mode-vi MouseDrag1Pane send -X stop-selection

# Links em qualquer painel: clique (ou Ctrl+clique) num endereço http/https abre a escolha do
# navegador (Chrome interno, Carbonyl ou o do sistema, a mesma do e-mail: tt --abrir-link) com a
# URL inteira, mesmo quando a tela a partiu em várias linhas (links-tt.py religa, inclusive com
# recuo ou borda) ou quando ela é um hyperlink OSC 8. Fora de um link, o clique segue para o
# programa como antes (sem python3, sempre segue). O clique (simples ou com Ctrl) espera o tempo
# de um duplo clique: o 2º clique e o arrasto cancelam a abertura (@tt_link_id; Ctrl+arrastar a
# partir de um link copia e não abre), e o Ctrl+duplo clique num link copia o link inteiro. Ctrl+B u (ou ⋯ → 🔗 Links da tela) lista os links do painel.
# Antes do python (~30 ms por clique), uma conferência de ~2 ms: sem hiperlink sob o mouse e sem "http" nem "://"
# nas mesmas linhas que o links-tt.py leria (as 80 do histórico e a tela), não há link possível e o clique segue
# direto. Qualquer corte de "https://" entre duas linhas deixa um dos dois pedaços em alguma delas. Usa o tmux do
# próprio servidor (/proc/PID/exe); sem /proc (macOS), o tmux do PATH.
bind -n MouseDown1Pane select-pane -t = \; set -gF @tt_link_seq '#{e|+:#{?@tt_link_seq,#{@tt_link_seq},0},1}' \; set -gF @tt_link_id '#{pid}:#{@tt_link_seq}' \; if -F "#{pane_in_mode}" { send -M } { if-shell "set -- #{q:mouse_hyperlink}; if [ $## -eq 0 ]; then { [ -x /proc/#{pid}/exe ] && /proc/#{pid}/exe -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80 || tmux -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80; } 2>/dev/null | grep -q -e :// -e http || exit 1; fi; exec python3 -I ~/.local/share/tt/links-tt.py clique #{q:client_name} #{pane_id} #{mouse_x} #{mouse_y} #{pane_width} #{pane_height} simples #{q:mouse_hyperlink} #{q:@tt_link_id}" {} { send -M } }
bind -n C-MouseDown1Pane select-pane -t = \; set -gF @tt_link_seq '#{e|+:#{?@tt_link_seq,#{@tt_link_seq},0},1}' \; set -gF @tt_link_id '#{pid}:#{@tt_link_seq}' \; if -F "#{pane_in_mode}" { send -M } { if-shell "set -- #{q:mouse_hyperlink}; if [ $## -eq 0 ]; then { [ -x /proc/#{pid}/exe ] && /proc/#{pid}/exe -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80 || tmux -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80; } 2>/dev/null | grep -q -e :// -e http || exit 1; fi; exec python3 -I ~/.local/share/tt/links-tt.py clique #{q:client_name} #{pane_id} #{mouse_x} #{mouse_y} #{pane_width} #{pane_height} ctrl #{q:mouse_hyperlink} #{q:@tt_link_id}" {} { send -M } }
bind -n M-MouseDown1Pane select-pane -t = \; set -gF @tt_link_seq '#{e|+:#{?@tt_link_seq,#{@tt_link_seq},0},1}' \; set -gF @tt_link_id '#{pid}:#{@tt_link_seq}' \; if -F "#{pane_in_mode}" { send -M } { if-shell "set -- #{q:mouse_hyperlink}; if [ $## -eq 0 ]; then { [ -x /proc/#{pid}/exe ] && /proc/#{pid}/exe -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80 || tmux -S #{q:socket_path} capture-pane -p -t #{pane_id} -S -80; } 2>/dev/null | grep -q -e :// -e http || exit 1; fi; exec python3 -I ~/.local/share/tt/links-tt.py clique #{q:client_name} #{pane_id} #{mouse_x} #{mouse_y} #{pane_width} #{pane_height} ctrl #{q:mouse_hyperlink} #{q:@tt_link_id}" {} { send -M } }
bind -n SecondClick1Pane set -g @tt_link_id "" \; send -M
bind -n C-SecondClick1Pane set -g @tt_link_id "" \; send -M
bind -n M-SecondClick1Pane set -g @tt_link_id "" \; send -M
bind u run-shell -b "~/.local/bin/tt --links-tela '#{client_name}' '#{pane_id}'"

# Visual comum: também reaplicado pelo vigia e ao conectar.
source-file ~/.local/share/tt/tema-tmux.conf
# Barras recalculadas por eventos; o padrão visual fica em tema-tmux.conf.
run-shell -b "~/.local/bin/tt --barras"
set-hook -g session-created 'run-shell -b "~/.local/bin/tt --barras"'
set-hook -g session-closed 'run-shell -b "~/.local/bin/tt --barras"'
set-hook -g session-renamed 'run-shell -b "~/.local/bin/tt --barras"'

# Snapshots do estado (snapshots=1 no config; `tt --snapshots on`): cada mudança do usuário avisa o tt, que junta a rajada e grava UM
# snapshot (até 50). Índices fixos [20]: recarregar esta config não acumula ganchos (set-hook -ga acumularia). Desligado, o tt sai na hora.
set-hook -g session-created[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento sessao-criada #{q:hook_session_name}"'
set-hook -g session-closed[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento sessao-fechada"'
set-hook -g session-renamed[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento sessao-renomeada #{q:hook_session_name}"'
set-hook -g after-new-window[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento janela-criada #{q:hook_session_name}"'
set-hook -g window-unlinked[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento janela-fechada"'
set-hook -gw window-renamed[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento janela-renomeada"'
set-hook -g after-split-window[20] 'run-shell -b "~/.local/bin/tt --snapshot-evento painel-dividido #{q:hook_session_name}"'

# Ctrl+B N: renomear esta sessão (vem preenchido com um nome sugerido pelo assunto)
# (no celular a tela pode ter menos de 70 colunas: aí o popup ocupa a largura toda)
bind N if -F "#{e|<:#{client_width},72}" \
  "display-popup -E -w 100% -h 7 -T ' renomear ' \"~/.local/bin/tt --renomear\"" \
  "display-popup -E -w 70 -h 7 -T ' renomear ' \"~/.local/bin/tt --renomear\""

# --- Painéis (splits) ------------------------------------------------------
# Cada painel ganha uma barrinha no topo com número e nome: o que você deu (menu ⋯ → Renomear),
# a sessão que ele mostra (⧉, abertos pelo tt) ou o programa. Só aparece com mais de um painel.
# A barrinha só existe com 2+ painéis: com um só, ela ocupava uma linha (azul) no topo, e cada tmux
# dentro de tmux (pontes, painéis que mostram outra sessão) empilhava mais uma.
set -g pane-border-status off
set-hook -g window-layout-changed 'run-shell -b "~/.local/bin/tt --bordas gancho"'
set-hook -g after-split-window[0] 'run-shell -b "~/.local/bin/tt --bordas gancho"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/tt --bordas gancho"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/tt --bordas gancho"'
# Rede de segurança contra ciclo de painéis (sessão que se mostra dentro dela mesma, até 1x1).
set-hook -g client-resized 'run-shell -b "~/.local/bin/tt --guarda-tamanho"'
set-hook -g window-resized 'run-shell -b "~/.local/bin/tt --guarda-tamanho"'
# Vista aninhada (cliente dentro de um painel ou popup: TERM tmux*/screen*) que trocou de sessão. [0] O cliente do e-mail
# (o único aninhado que anexa a _tt-email) perde a influência no tamanho antes de voltar diretamente pelo gancho.
# Usa o cliente do contexto: refresh-client não expande um literal #{client_name} em -t. O helper confere o retorno
# e completa por comando externo nos tmux que ignoram switch-client no próprio gancho; falha fecha só essa vista.
# Com painel flutuante, mostrar a janela que contém o próprio painel criaria uma cascata até cair.
# [1] Outra vista aninhada que passou a mostrar a sessão onde ela mesma está (ciclo): o tt a desliga.
set-hook -g 'client-session-changed[0]' 'if -F "#{&&:#{==:#{client_last_session},_tt-email},#{||:#{m:tmux*,#{client_termname}},#{m:screen*,#{client_termname}}}}" { refresh-client -f ignore-size ; switch-client -t "=_tt-email" ; run-shell -b "~/.local/bin/tt --guarda-aninhado #{q:client_name} voltou" }'
set-hook -g 'client-session-changed[1]' 'if -F "#{&&:#{!=:#{client_last_session},_tt-email},#{||:#{m:tmux*,#{client_termname}},#{m:screen*,#{client_termname}}}}" "run-shell -b \"~/.local/bin/tt --guarda-aninhado #{client_name}\""'
run-shell -b "~/.local/bin/tt --bordas"

# Cliques nos botões da barra (veja status-right) e menu do painel (Ctrl+B m, ou botão direito na
# barrinha do painel).
# Os menus agem ao SOLTAR (MouseUp): no celular o "soltar" do toque chega atrasado e fechava o
# menu que o "pressionar" tinha acabado de abrir. As fixadas (fxN e fxxN), porém, agem ao
# PRESSIONAR: a barra pode se redesenhar entre pressionar e soltar e perder o range sob o dedo.
# A lista de janelas continua no pressionar.
unbind -n MouseDown1StatusRight
unbind -n MouseDown1StatusLeft
bind -n MouseDown1StatusRight run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'd'"
bind -n MouseDown1StatusLeft run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'd'"
bind -n MouseUp1StatusRight run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'u'"
bind -n MouseUp1StatusLeft run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'u'"
bind -n MouseDown1Status run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'd'"
bind -n MouseUp1Status run-shell -b "~/.local/bin/tt --clique '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{pane_current_path}' '#{mouse_x}' 'u'"
bind m run-shell -b "~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'"
# Histórico de cópias (de todas as máquinas): ⏎ cola aqui, ^y só copia, ^x apaga.
bind y run-shell -b "~/.local/bin/tt --clique copias '#{client_name}' '#{pane_id}' ''"
# Botão direito: no painel (quando o programa dele não usa o mouse), o menu do painel; em "máquina ▾",
# a administração; em "sessão ▾", o menu da sessão. Também abrem ao soltar o botão.
bind -n MouseDown3Pane if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" "select-pane -t = ; send-keys -M" "select-pane -t ="
bind -n MouseUp3Pane if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "run-shell -b -t = \"~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'\""
unbind -n MouseDown3StatusLeft
bind -n MouseUp3StatusLeft run-shell -b "~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'"
# Em "máquina ▾"/"sessão ▾" o tmux reporta o clique como Status (não StatusLeft): o pressionar não
# abre o menu de janelas padrão (que engoliria o soltar) e o soltar abre o menu das máquinas.
bind -n MouseDown3Status if -F "#{||:#{||:#{||:#{==:#{mouse_status_range},maquina},#{==:#{mouse_status_range},sessao}},#{m:fx*,#{mouse_status_range}}},#{m:at*,#{mouse_status_range}}}" {} { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }
bind -n MouseUp3Status if -F "#{||:#{||:#{||:#{==:#{mouse_status_range},maquina},#{==:#{mouse_status_range},sessao}},#{m:fx*,#{mouse_status_range}}},#{m:at*,#{mouse_status_range}}}" "run-shell -b \"~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'\"" ""
# Roda do mouse em "máquina ▾": troca de máquina (vai à primeira sessão da lista de lá; se não houver nenhuma, cria
# uma; máquina que não responde é pulada). Em "sessão ▾": troca de sessão nesta máquina (na ordem do Ctrl+B ( e ),
# sem pontes nem ocultas). Para baixo = a seguinte, para cima = a anterior. No resto da barra, o padrão do tmux.
bind -n WheelUpStatus if -F "#{||:#{==:#{mouse_status_range},maquina},#{||:#{==:#{mouse_status_range},sessao},#{==:#{mouse_status_range},fixmais}}}" { run-shell -b "~/.local/bin/tt --rolar '#{mouse_status_range}' -1 '#{client_name}'" } { previous-window }
bind -n WheelDownStatus if -F "#{||:#{==:#{mouse_status_range},maquina},#{||:#{==:#{mouse_status_range},sessao},#{==:#{mouse_status_range},fixmais}}}" { run-shell -b "~/.local/bin/tt --rolar '#{mouse_status_range}' +1 '#{client_name}'" } { next-window }
# Botão direito nos botões da direita da barra (📧 e-mail: menu com abrir, contas e atalhos).
unbind -n MouseDown3StatusRight
bind -n MouseUp3StatusRight run-shell -b "~/.local/bin/tt --clique-direito '#{mouse_status_range}' '#{client_name}' '#{pane_id}' '#{mouse_x}'"
bind -n MouseDown3Border run-shell -b -t = "~/.local/bin/tt --menu-painel '#{client_name}' '#{pane_id}'"

# Vigia que renomeia as sessões conforme o uso (uma instância só; termina junto com o tmux)
run-shell -b "~/.local/bin/tt --vigia"

# Botões inteligentes: a barra de teclas extras do Termux manda Ctrl+B F1…F10 e `tt --botao` decide
# pelo estado (ver termux/termux.properties). Também servem como atalhos de teclado.
bind F1  run-shell -b "~/.local/bin/tt --botao cl   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F2  run-shell -b "~/.local/bin/tt --botao clc  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F3  run-shell -b "~/.local/bin/tt --botao clr  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F4  run-shell -b "~/.local/bin/tt --botao dbn  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F5  run-shell -b "~/.local/bin/tt --botao tela '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F6  run-shell -b "~/.local/bin/tt --botao sair '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F7  run-shell -b "~/.local/bin/tt --botao ant  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F8  run-shell -b "~/.local/bin/tt --botao dv   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F9  run-shell -b "~/.local/bin/tt --botao zm   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind F10 run-shell -b "~/.local/bin/tt --botao jn   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"

# Os mesmos botões sem a tecla F (no Mac, F1–F10 sem fn viram brilho e volume): Ctrl+B g e depois 1 a 9 e 0
# (1=F1 … 9=F9, 0=F10). A tabela tt-botoes volta sozinha ao normal depois da tecla.
bind g switch-client -T tt-botoes
bind -T tt-botoes 1 run-shell -b "~/.local/bin/tt --botao cl   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 2 run-shell -b "~/.local/bin/tt --botao clc  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 3 run-shell -b "~/.local/bin/tt --botao clr  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 4 run-shell -b "~/.local/bin/tt --botao dbn  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 5 run-shell -b "~/.local/bin/tt --botao tela '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 6 run-shell -b "~/.local/bin/tt --botao sair '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 7 run-shell -b "~/.local/bin/tt --botao ant  '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 8 run-shell -b "~/.local/bin/tt --botao dv   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 9 run-shell -b "~/.local/bin/tt --botao zm   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"
bind -T tt-botoes 0 run-shell -b "~/.local/bin/tt --botao jn   '#{client_name}' '#{pane_id}' '#{pane_current_path}'"

# Perfil local: ajustes só desta máquina/usuário, fora do pacote (que é trocado a cada instalação).
source-file -q ~/.config/tt/tmux.conf

# A janela do terminal nunca fecha sozinha: se a sessão anexada morrer, o cliente pula para
# outra sessão em vez de desanexar (com exec tmux no bashrc, desanexar fechava a aba inteira).
set -g detach-on-destroy off

# Conversa do tt-mesh (do dia, como chat): abre pela direita; q ou Esc fecha. Lê o tt-mesh DESTA pessoa (TT_MESH ou ~/tt-mesh).
bind M display-popup -E -w 46 -h 100% -x R -y 0 -T ' conversa do mesh ' "~/.local/bin/tt --conversa-mesh | less -R +G"
