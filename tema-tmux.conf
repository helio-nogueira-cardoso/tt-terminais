# Padrão visual completo do tt. Reaplicado sem reiniciar sessões ou agentes.
set -g window-style "fg=#cdd6f4,bg=#1e1e2e"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"
set -g pane-colours[0] "#45475a"
set -g pane-colours[1] "#f38ba8"
set -g pane-colours[2] "#a6e3a1"
set -g pane-colours[3] "#f9e2af"
set -g pane-colours[4] "#89b4fa"
set -g pane-colours[5] "#f5c2e7"
set -g pane-colours[6] "#94e2d5"
set -g pane-colours[7] "#bac2de"
set -g pane-colours[8] "#585b70"
set -g pane-colours[9] "#eba0ac"
set -g pane-colours[10] "#a6e3a1"
set -g pane-colours[11] "#f9e2af"
set -g pane-colours[12] "#89b4fa"
set -g pane-colours[13] "#f5c2e7"
set -g pane-colours[14] "#94e2d5"
set -g pane-colours[15] "#cdd6f4"
set -g popup-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-position bottom
set -g status-interval 15
set -g 'status-format[1]' "#[align=left,bg=#181825]#{E:@barra_fixadas}#[align=right]#{E:@barra_tarefas}#{E:@barra_versao}"
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 60
set -g status-left "#[range=user|maquina]#[bg=#89b4fa,fg=#1e1e2e,bold] #{E:@maquina} ▾ #[norange]#[range=user|sessao]#[bg=#313244,fg=#cdd6f4,nobold] #S ▾ #[norange]#[range=user|fixar]#[bg=#313244]#{?#{@tt_fixada}, 📌 , 📍 }#[norange]#[default] "
set -g status-right-length 180
set -g status-right "#{?client_prefix,#[fg=#f38ba8]#[bold]● prefixo  #[nobold],}#{?#{&&:#{e|<:#{client_width},90},#{||:#{!=:#{window_width},#{client_width}},#{!=:#{window_height},#{e|-:#{client_height},#{?#{==:#{status},on},1,#{?#{==:#{status},off},0,#{status}}}}}}},,#{?#{>:#{session_attached},1},#[fg=#a6e3a1]⇄ #{session_attached}#{?#{e|<:#{client_width},90},, telas}  ,}}\
#{?#{||:#{!=:#{window_width},#{client_width}},#{!=:#{window_height},#{e|-:#{client_height},#{?#{==:#{status},on},1,#{?#{==:#{status},off},0,#{status}}}}}},#[range=user|ajustar]#[fg=#1e1e2e]#[bg=#f9e2af]#[bold] ⤢#{?#{e|<:#{client_width},90},, caber aqui} #[norange]#[default] ,}\
#{E:@barra_transf}#{E:@barra_atalhos}\
#[range=user|tt]#[fg=#1e1e2e,bg=#89b4fa,bold] ☰#{?#{e|<:#{client_width},90},, terminais} #[norange]#[default] \
#[range=user|painel]#[fg=#cdd6f4,bg=#45475a] ⋯#{?#{e|<:#{client_width},90},, painel} #[norange]#[default] \
#[range=user|email]#{E:@barra_email}#[norange]#[default] \
#{?#{e|<:#{client_width},60},,#[range=user|relogio]#[fg=#a6adc8]#{?#{e|<:#{client_width},90},,#{E:@barra_data}}%H:%M #[norange]#[default]}"
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#a6e3a1,fg=#1e1e2e,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines rounded
set -g pane-border-format "#{?#{e|>:#{window_panes},1}, #{?pane_active,#[fg=#89b4fa]#[bold],#[fg=#6c7086]}#{pane_index} #{?#{@nome_painel},#{@nome_painel},#{?#{@tt_rotulo},⧉ #{@tt_rotulo},#{pane_current_command}}} #[nobold]#[fg=#6c7086]#{b:pane_current_path} ,}"
