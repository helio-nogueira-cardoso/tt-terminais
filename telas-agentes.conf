# Telas dos agentes de IA que aparecem antes da conversa de verdade (ou no meio dela) e pedem uma resposta.
# A voz do tt (🚀 pela voz, 👇 e ⏩) lê cada tela com o telas-agentes.py e decide pelo catálogo abaixo:
#   rotina   responde sozinha (atualização, termos, tema, aviso de segurança, login já feito, "Enter para continuar")
#   pasta    "confiar nesta pasta": responde sozinha só se a pasta está na lista que você autorizou
#            (~/.config/tt-voz/pastas, ou voz --pastas); fora dela, a voz pergunta e oferece "sempre"
#   decisao  nunca responde: a voz lê a pergunta e as opções e espera a sua escolha (senha, credencial, algo
#            destrutivo, permissão nova de execução, dinheiro)
# Tela com menu, [s/n] ou "Enter para continuar" que nenhum bloco reconhece também é perguntada a você.
#
# Como estender: acrescente blocos em ~/.config/tt/telas-agentes.conf (mesmo formato). Um bloco com o mesmo [id]
# de um daqui troca o daqui (no mesmo lugar da ordem); "classe = -" desliga um bloco. Campos:
#   agente  claude | codex | kiro | gemini | ... | * (qualquer). Com o agente reconhecido pela tela, os blocos de
#           outro agente ficam de fora; sem reconhecer, valem todos.
#   tela    expressão regular (Python, sem diferença de maiúsculas) procurada nas últimas linhas da tela
#   opcao   expressão da opção do menu a escolher (vale a 1ª que casa); "@marcada" = a que já está marcada.
#           Num [s/n], casa com "yes" ou "no".
#   evitar  expressão de opções que este bloco nunca escolhe
#   tecla   teclas a mandar em vez de escolher uma opção (Enter, Escape, y, n…, separadas por espaço)
#   motivo  como a voz explica uma decisão (curto, falado)
# Ordem: a trava do código (senha pedida na última linha) vem primeiro; depois TODOS os blocos "decisao" (na ordem
# do arquivo); só então os de rotina e pasta, na ordem do arquivo. Assim um bloco de rotina nunca aprova uma tela
# que também pareça destrutiva, peça credencial ou permissão nova. A opção escolhida sozinha também nunca pode
# ser do tipo "não perguntar de novo", "sempre", "todas", "acesso total", "apagar" (trava do código).

# ---------- decisões: sempre perguntadas (valem para qualquer agente) ----------
[credencial]
agente = *
classe = decisao
tela = select login method|choose (a |your )?(login|sign.in) method|not logged in|please (log|sign) ?in|log ?in to (continue|use)|sign in (to|with) (your|chatgpt|google|github|aws|builder)|provide your own api key|enter (your |the )?(api key|token|access key|code)|paste (the |your )?(code|token|key)|cole o c[oó]digo|api.?key|chave de api|access token|token de acesso|credential|credencia|device code|c[oó]digo do aparelho|authenticate|autentic
motivo = pede login ou credencial

[destrutivo]
agente = *
classe = decisao
tela = \bdelet(e|ing)\b|\bremov(e|ing)\b|\berase\b|\bwipe\b|rm -r|drop (table|database)|\btruncate\b|reset --hard|force.push|push --force|\boverwrite\b|\bdiscard\b|apag(ar|ue)|exclu(ir|a)|remov(er|a)\b|sobrescrev|descart(ar|e)|format(ar|e o disco)
motivo = é algo destrutivo

[permissao-execucao]
agente = *
classe = decisao
tela = do you want to (proceed|run|execute|allow|make (this|these) edits?|create|apply|approve)|would you like to (run|make|grant|allow|apply|send|approve)|allow (this|the) (action|command|tool|edit|request)|\bapprove\b|\baprova(r)?\b|deseja (executar|permitir|aplicar)|permitir (que|este|esta|o comando)|\[y/n/t\]|don.t ask again|always allow|trust (all|this) tools?|new mcp servers? found|mcp servers? found in|full access|acesso total|these will apply without asking|this folder runs commands|trust these settings|managed settings require approval|run (this|the following) command|execute (this|the following)|network access to
motivo = pede permissão nova de execução

[dinheiro]
agente = *
classe = decisao
tela = usage credits|add funds|buy (more )?credits|comprar cr[eé]ditos|extra usage|billing|cobran[cç]a
motivo = envolve cobrança ou créditos

# ---------- Claude Code ----------
[claude-pasta]
agente = claude
classe = pasta
tela = quick safety check|trust the files in this folder|do you trust the files|is this a project you created or one you trust
opcao = ^yes, (i trust this folder|proceed)|^sim
evitar = without these permissions

[claude-sem-permissoes]
# Aviso do modo que o próprio 🚀 pediu (o ia-conta abre o Claude com --dangerously-skip-permissions): não é uma
# permissão nova. Quem preferir ouvir esta pergunta troca a classe para decisao no seu telas-agentes.conf.
agente = claude
classe = rotina
tela = running in bypass permissions mode|in bypass permissions mode, claude code will not ask
opcao = ^yes, i accept$

[claude-termos]
# Termos novos: aceita sem ceder as conversas para treinar modelos (a opção "OFF")
agente = claude
classe = rotina
tela = updates to consumer terms|consumer terms and (privacy )?polic|accept the updated terms
opcao = ^accept terms.*:\s*off\b
evitar = :\s*on\b

[claude-tema]
agente = claude
classe = rotina
tela = choose the text style that looks best|let.s get started\.?\s*$
opcao = @marcada

[claude-terminal]
agente = claude
classe = rotina
tela = use claude code.s terminal setup|recommended settings for your terminal
opcao = ^no, maybe later

[claude-avisos]
agente = claude
classe = rotina
tela = security notes:|claude can make mistakes|press enter to continue|login successful
tecla = Enter

# ---------- Codex ----------
[codex-pasta]
agente = codex
classe = pasta
tela = trust this folder\?|do you trust the contents of this (directory|folder)|you are running codex in|allow codex to work in this folder
opcao = ^trust and continue$|^yes, continue$|^sim
evitar = without asking|sem pedir|full access

[codex-atualizacao]
agente = codex
classe = rotina
tela = update available|new version of codex|skip until next version
opcao = ^skip$|^pular$|^not now$
evitar = until|at[eé]

[codex-modelo]
# Modelo novo ou troca por limite: fica no que já usa (nada muda sem você pedir)
agente = codex
classe = rotina
tela = just got an upgrade|introducing |try new model|keep current model|rate.limit.switch
opcao = ^use existing model|^keep current model$|^not now$
evitar = never show

[codex-boas-vindas]
agente = codex
classe = rotina
tela = welcome to codex|signed in with your chatgpt account|press enter to continue
tecla = Enter

# ---------- Kiro ----------
[kiro-pasta]
agente = kiro
classe = pasta
tela = do you trust (this|the) (folder|directory|workspace)|trust (this|the) (folder|workspace)
opcao = ^(yes|trust)|^sim
evitar = parent|all|tod

[kiro-avisos]
agente = kiro
classe = rotina
tela = press enter to continue|you are logged in|logged in (as|with)|welcome to kiro
tecla = Enter

# ---------- Gemini CLI (exemplo de outro agente) ----------
[gemini-pasta]
agente = gemini
classe = pasta
tela = do you trust this folder|trust folder
opcao = ^trust folder
evitar = parent

# ---------- qualquer agente ----------
[pasta-generica]
agente = *
classe = pasta
tela = do you trust (this|the) (folder|directory|workspace|files)|trust (this|the) (folder|directory|workspace)|confia(r)? (nesta|na|neste) (pasta|diret[oó]rio)
opcao = ^(yes|sim|trust|confiar|confio)
evitar = parent|pai|without asking|sem pedir|all\b|tod[ao]s

[atualizacao-generica]
agente = *
classe = rotina
tela = update available|new version|nova vers[aã]o|atualiza[cç][aã]o dispon
opcao = ^(skip|pular|not now|agora n[aã]o|later|depois|mais tarde|remind me later)
evitar = until|at[eé]|always|sempre|never|nunca

[enter-generico]
agente = *
classe = rotina
tela = press enter to continue|pressione enter para continuar|hit enter to continue|enter para continuar
tecla = Enter
